spring.application.name=Vehicle_Configurator
spring.datasource.url=jdbc:mysql://localhost:3306/vconfig
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=ThisIsMyVerySecretKeyForVehicleConfiguratorProject12345
# Create logs folder and application.log file
logging.file.name=logs/application.log

# Log level
logging.level.root=INFO

# Log pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
server.port=8080